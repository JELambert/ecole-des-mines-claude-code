id: quick_start
display_name: "Quick Start — Sentinel Health RPM"
description: >
  Answers the five board questions on a Sentinel-shaped dataset: outcomes,
  segmentation, engagement-outcome correlation, site performance, and
  cost-benefit.
estimated_runtime: "<1 minute"
requires_data: true

steps:
  - id: register_pilot
    step: 1
    display_name: "Register Sentinel pilot dataset"
    action: register_dataset
    params:
      dataset_id: sentinel_health_pilot

  - id: outcomes_pre_vs_during
    step: 2
    display_name: "Q1 — ER + hospitalization reduction"
    action: derive_observations
    params:
      construct_ids: [er_visit_reduction, hospitalization_reduction]
      sql: |
        SELECT
          primary_condition,
          SUM(er_visits_12mo_pre) - SUM(er_visits_during_program)            AS er_reduction,
          SUM(hospitalizations_12mo_pre) - SUM(hospitalizations_during_program) AS hosp_reduction
        FROM sentinel_health_pilot
        GROUP BY primary_condition;

  - id: segment_cuts
    step: 3
    display_name: "Q2 — Segmentation by condition × age × risk"
    action: derive_observations
    params:
      construct_ids: [er_visit_reduction, baseline_risk]
      sql: |
        SELECT
          primary_condition,
          CASE WHEN age < 55 THEN '<55'
               WHEN age < 70 THEN '55-69'
               ELSE '70+' END AS age_band,
          CASE WHEN baseline_risk_score < 3.5 THEN 'Low'
               WHEN baseline_risk_score < 6.5 THEN 'Medium'
               ELSE 'High' END AS risk_tier,
          AVG(er_visits_12mo_pre - er_visits_during_program) AS avg_er_reduction
        FROM sentinel_health_pilot
        GROUP BY 1, 2, 3;

  - id: engagement_correlation
    step: 4
    display_name: "Q3 — Engagement-outcome correlation"
    engine: correlation_matrix
    params:
      variables:
        - avg_weekly_readings
        - app_logins_per_month
        - er_reduction
        - hosp_reduction

  - id: site_performance
    step: 5
    display_name: "Q4 — Site performance ranking"
    action: derive_observations
    params:
      construct_ids: [er_visit_reduction, hospitalization_reduction]
      sql: |
        SELECT
          clinic_site,
          COUNT(*) AS patients,
          AVG(avg_weekly_readings) AS engagement,
          1.0 - SUM(er_visits_during_program) / NULLIF(SUM(er_visits_12mo_pre), 0) AS er_reduction_pct,
          1.0 - SUM(hospitalizations_during_program) / NULLIF(SUM(hospitalizations_12mo_pre), 0) AS hosp_reduction_pct
        FROM sentinel_health_pilot
        GROUP BY clinic_site
        ORDER BY er_reduction_pct DESC;

  - id: cost_benefit
    step: 6
    display_name: "Q5 — Cost-benefit"
    action: derive_observations
    params:
      construct_ids: [estimated_avoided_cost, net_program_value]
      sql: |
        SELECT
          SUM((er_visits_12mo_pre - er_visits_during_program) * 1400
            + (hospitalizations_12mo_pre - hospitalizations_during_program) * 13000) AS estimated_avoided_cost_usd,
          SUM(total_cost_to_date_usd)                                                 AS program_cost_usd,
          SUM((er_visits_12mo_pre - er_visits_during_program) * 1400
            + (hospitalizations_12mo_pre - hospitalizations_during_program) * 13000)
            - SUM(total_cost_to_date_usd)                                             AS net_value_usd
        FROM sentinel_health_pilot;
